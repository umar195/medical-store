    async function renderPOS() { const { medicines, batches, customers, heldSales } = await getMasterData(); const state = APP.state.pos; const stockMap = getMedicineStockMap(medicines, batches); const results = medicines.filter((m) => { const hay = `${m.name} ${m.code} ${m.genericName}`.toLowerCase(); return !state.search || hay.includes(state.search.toLowerCase()); }).sort((a,b) => a.name.localeCompare(b.name)).slice(0, 12); const totalQty = APP.posCart.reduce((sum, i) => sum + Number(i.qty || 0), 0); const subTotal = APP.posCart.reduce((sum, i) => sum + Number(i.qty || 0) * Number(i.price || 0), 0); const discount = Utils.parseNumber(state.discount); const tax = Utils.parseNumber(state.tax); const total = subTotal - discount + (subTotal - discount) * tax / 100; const change = Math.max(0, Utils.parseNumber(state.cashReceived || 0) - total); setContent(`${pageHeader('POS / Sales', 'Search medicines, build cart, hold sales, and issue invoices.')}<div class="pos-layout"><div class="grid"><div class="card"><div class="toolbar"><div class="search-wrap"><span>🔎</span><input id="pos-search" placeholder="Search by medicine name, code, generic name" value="${Utils.escapeHtml(state.search)}" /><button class="icon-btn sm" id="pos-clear-search">✕</button></div></div><div class="result-list">${results.length ? results.map((m) => { const qty = stockMap[m.id]?.qty || 0; const activeBatches = getAvailableBatchesForMedicine(m.id, null, batches); const preferred = activeBatches[0]; return `<div class="medicine-card"><div><div style="font-weight:700;">${Utils.escapeHtml(m.name)}</div><div class="small muted">${Utils.escapeHtml(m.code)} • ${Utils.escapeHtml(m.genericName)} • ${Utils.escapeHtml(m.strength || '')}</div><div class="small muted" style="margin-top:8px;">Retail ${Utils.currency(m.retailPrice)} • Stock ${qty} ${Utils.escapeHtml(m.unit || '')}</div>${preferred ? `<div class="small muted" style="margin-top:4px;">Preferred batch ${Utils.escapeHtml(preferred.batchNumber)} • Exp ${Utils.date(preferred.expiryDate)}${Utils.daysUntil(preferred.expiryDate) <= APP.settings.expiryAlertDays ? ' • Near expiry' : ''}</div>` : '<div class="small muted" style="margin-top:4px;">No active batch available</div>'}</div><div><div style="font-size:20px; font-weight:800; text-align:right;">${Utils.currency(m.retailPrice)}</div><div class="actions" style="margin-top:12px; justify-content:flex-end;"><button class="btn ${qty <= 0 ? 'secondary' : ''} sm" ${qty <= 0 ? 'disabled' : ''} data-add-cart="${m.id}">Add</button></div></div></div>`; }).join('') : emptyState('No medicines match the current search.')}</div></div><div class="card"><div class="page-header" style="margin-bottom:12px;"><div><div style="font-size:18px; font-weight:700;">Held Sales</div><div class="page-desc">Pause and resume transactions</div></div></div><div class="list-stack">${heldSales.length ? heldSales.map((h) => `<div class="mini-card"><div style="display:flex; justify-content:space-between; gap:10px;"><div><strong>${Utils.escapeHtml(h.name || 'Held Sale')}</strong><div class="small muted">${(h.cart || []).length} item(s) • ${Utils.datetime(h.createdAt)}</div></div><button class="btn secondary sm" data-resume-held="${h.id}">Resume</button></div></div>`).join('') : '<div class="small muted">No held sales.</div>'}</div></div></div><div class="grid"><div class="card"><div class="page-header" style="margin-bottom:12px;"><div><div style="font-size:18px; font-weight:700;">Current Cart</div><div class="page-desc">${totalQty} item(s)</div></div></div><div class="table-wrap"><table><thead><tr><th>Medicine</th><th>Qty</th><th>Price</th><th>Batch</th><th>Total</th><th></th></tr></thead><tbody>${APP.posCart.length ? APP.posCart.map((item) => { const med = medicines.find((m) => Number(m.id) === Number(item.medicineId)); const itemBatches = getAvailableBatchesForMedicine(item.medicineId, item.preferredBatchId, batches); return `<tr><td><strong>${Utils.escapeHtml(med?.name || '')}</strong><div class="small muted">${Utils.escapeHtml(med?.code || '')}</div></td><td><div class="actions"><button class="btn secondary sm" data-cart-minus="${item.medicineId}">-</button><input type="number" min="1" value="${item.qty}" data-cart-qty="${item.medicineId}" style="width:70px;" /><button class="btn secondary sm" data-cart-plus="${item.medicineId}">+</button></div></td><td>${Utils.currency(item.price)}</td><td><select data-batch-pref="${item.medicineId}"><option value="">Auto</option>${itemBatches.map((b) => `<option value="${b.id}" ${Number(item.preferredBatchId)===Number(b.id)?'selected':''}>${Utils.escapeHtml(b.batchNumber)} (${b.currentQty}) • ${b.expiryDate}</option>`).join('')}</select></td><td>${Utils.currency(item.qty * item.price)}</td><td><button class="btn danger sm" data-cart-remove="${item.medicineId}">Remove</button></td></tr>`; }).join('') : `<tr><td colspan="6">${emptyState('Cart is empty. Search and add medicines.')}</td></tr>`}</tbody></table></div><div class="grid cols-2" style="margin-top:16px;"><div class="field"><label>Customer</label><select id="pos-customer"><option value="walk-in">Walk-in customer</option>${customers.map((c) => `<option value="${c.id}" ${String(state.customerId)===String(c.id)?'selected':''}>${Utils.escapeHtml(c.name)}</option>`).join('')}</select></div><div class="field"><label>Payment Method</label><select id="pos-payment-method">${PAYMENT_METHODS.map((m) => `<option ${state.paymentMethod===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>Discount</label><input id="pos-discount" type="number" step="0.01" value="${discount}" /></div><div class="field"><label>Tax %</label><input id="pos-tax" type="number" step="0.01" value="${tax}" /></div><div class="field"><label>Paid Amount</label><input id="pos-paid" type="number" step="0.01" value="${state.paidAmount || 0}" /></div><div class="field"><label>Cash Received</label><input id="pos-cash" type="number" step="0.01" value="${state.cashReceived || 0}" /></div></div><div class="invoice-preview" style="margin-top:16px;"><div class="stats-inline"><span>Subtotal: <strong>${Utils.currency(subTotal)}</strong></span><span>Discount: <strong>${Utils.currency(discount)}</strong></span><span>Tax: <strong>${tax}%</strong></span><span>Grand Total: <strong>${Utils.currency(total)}</strong></span><span>Change: <strong>${Utils.currency(change)}</strong></span></div></div><div class="actions" style="margin-top:16px;"><button class="btn secondary" id="hold-sale-btn">Hold Sale</button><button class="btn success" id="complete-sale-btn">Complete Sale</button></div></div></div></div>`); bindPOSActions(medicines, batches); document.getElementById('pos-search').oninput = (e) => { state.search = e.target.value; renderCurrentRoute(); }; document.getElementById('pos-clear-search').onclick = () => { state.search = ''; renderCurrentRoute(); }; document.getElementById('pos-customer').onchange = (e) => { state.customerId = e.target.value; }; document.getElementById('pos-payment-method').onchange = (e) => { state.paymentMethod = e.target.value; }; document.getElementById('pos-discount').oninput = (e) => { state.discount = e.target.value; renderCurrentRoute(); }; document.getElementById('pos-tax').oninput = (e) => { state.tax = e.target.value; renderCurrentRoute(); }; document.getElementById('pos-paid').oninput = (e) => { state.paidAmount = e.target.value; }; document.getElementById('pos-cash').oninput = (e) => { state.cashReceived = e.target.value; renderCurrentRoute(); }; document.getElementById('hold-sale-btn').onclick = holdCurrentSale; document.getElementById('complete-sale-btn').onclick = completeCurrentSale; document.querySelectorAll('[data-resume-held]').forEach((el) => el.onclick = () => resumeHeldSale(Number(el.dataset.resumeHeld))); }
    function bindPOSActions(medicines, batches) { document.querySelectorAll('[data-add-cart]').forEach((el) => el.onclick = () => { const id = Number(el.dataset.addCart); const med = medicines.find((m) => Number(m.id) === id); const stock = getMedicineStockMap(medicines, batches)[id]?.qty || 0; if (stock <= 0) return Utils.toast('Cannot add out-of-stock medicine.', 'warning'); const batch = getAvailableBatchesForMedicine(id, null, batches)[0]; if (!batch) return Utils.toast('No sellable batch available.', 'warning'); if (Utils.daysUntil(batch.expiryDate) <= APP.settings.expiryAlertDays) Utils.toast(`${med.name} is near expiry.`, 'warning'); const existing = APP.posCart.find((i) => Number(i.medicineId) === id); if (existing) existing.qty += 1; else APP.posCart.push({ medicineId:id, qty:1, price:Number(med.retailPrice), preferredBatchId:batch.id }); renderCurrentRoute(); }); document.querySelectorAll('[data-cart-minus]').forEach((el) => el.onclick = () => { const item = APP.posCart.find((i) => Number(i.medicineId) === Number(el.dataset.cartMinus)); if (item) { item.qty = Math.max(1, item.qty - 1); renderCurrentRoute(); } }); document.querySelectorAll('[data-cart-plus]').forEach((el) => el.onclick = () => { const item = APP.posCart.find((i) => Number(i.medicineId) === Number(el.dataset.cartPlus)); if (item) { item.qty += 1; renderCurrentRoute(); } }); document.querySelectorAll('[data-cart-remove]').forEach((el) => el.onclick = () => { APP.posCart = APP.posCart.filter((i) => Number(i.medicineId) !== Number(el.dataset.cartRemove)); renderCurrentRoute(); }); document.querySelectorAll('[data-cart-qty]').forEach((el) => el.onchange = () => { const item = APP.posCart.find((i) => Number(i.medicineId) === Number(el.dataset.cartQty)); if (item) { item.qty = Math.max(1, Utils.parseNumber(el.value)); renderCurrentRoute(); } }); document.querySelectorAll('[data-batch-pref]').forEach((el) => el.onchange = () => { const item = APP.posCart.find((i) => Number(i.medicineId) === Number(el.dataset.batchPref)); if (item) item.preferredBatchId = el.value ? Number(el.value) : null; }); }
    async function holdCurrentSale() { if (!APP.posCart.length) return Utils.toast('Cart is empty.', 'warning'); Utils.openModal({ title:'Hold Sale', size:'sm', content:`<div class="field"><label>Reference Name</label><input name="name" placeholder="E.g. Counter 1 / Customer name" required /></div>`, onSubmit:async (fd, _, close) => { await DB.add('heldSales', { name:fd.get('name'), cart:APP.posCart, state:{ ...APP.state.pos }, createdAt:new Date().toISOString() }); APP.posCart = []; close(); Utils.toast('Sale held successfully.', 'success'); renderCurrentRoute(); } }); }
    async function resumeHeldSale(id) { const hold = await DB.get('heldSales', id); if (!hold) return; APP.posCart = hold.cart || []; APP.state.pos = { ...APP.state.pos, ...(hold.state || {}) }; await DB.delete('heldSales', id); Utils.toast('Held sale resumed.', 'success'); renderCurrentRoute(); }
    async function completeCurrentSale() { try { if (!APP.posCart.length) throw new Error('Cart is empty.'); const [medicines, batches] = await Promise.all([DB.getAll('medicines'), DB.getAll('batches')]); const stockMap = getMedicineStockMap(medicines, batches); for (const item of APP.posCart) { const med = medicines.find((m) => Number(m.id) === Number(item.medicineId)); if ((stockMap[item.medicineId]?.qty || 0) < Number(item.qty)) throw new Error(`Not enough stock for ${med.name}.`); const active = getAvailableBatchesForMedicine(item.medicineId, item.preferredBatchId, batches); if (!active.length) throw new Error(`${med.name} has no active batch.`); if (active.every((b) => Utils.daysUntil(b.expiryDate) < 0)) throw new Error(`${med.name} is expired.`); } const sale = await createSale({ customerId:APP.state.pos.customerId, discount:APP.state.pos.discount, tax:APP.state.pos.tax, paidAmount:APP.state.pos.paidAmount || 0, cashReceived:APP.state.pos.cashReceived || 0, paymentMethod:APP.state.pos.paymentMethod, items:APP.posCart }); APP.posCart = []; APP.state.pos.discount = APP.settings.defaultDiscount || 0; APP.state.pos.tax = APP.settings.defaultTax || 0; APP.state.pos.paidAmount = 0; APP.state.pos.cashReceived = 0; Utils.toast(`Sale ${sale.invoiceNumber} completed.`, 'success'); openInvoiceModal(sale.id); renderCurrentRoute(); } catch (error) { Utils.toast(error.message, 'danger'); } }
    async function openInvoiceModal(saleId) { const [sale, medicines, saleItems, customers] = await Promise.all([DB.get('sales', saleId), DB.getAll('medicines'), DB.getAll('saleItems'), DB.getAll('customers')]); const items = saleItems.filter((i) => Number(i.saleId) === Number(saleId)); const customer = customers.find((c) => Number(c.id) === Number(sale.customerId)); Utils.openModal({ title:`Invoice ${sale.invoiceNumber}`, size:'md', hideFooter:true, content:`<div class="print-area invoice-preview" id="invoice-print-area"><div style="display:flex; justify-content:space-between; gap:20px; align-items:flex-start;"><div><div style="font-size:24px; font-weight:800;">${Utils.escapeHtml(APP.settings.storeName)}</div><div class="small muted">${Utils.escapeHtml(APP.settings.address)}<br>${Utils.escapeHtml(APP.settings.phone)} • ${Utils.escapeHtml(APP.settings.email)}</div></div><div class="right"><div class="mono"><strong>${Utils.escapeHtml(sale.invoiceNumber)}</strong></div><div class="small muted">${Utils.date(sale.date)}</div></div></div><hr style="border:0;border-top:1px solid var(--border);margin:16px 0;"><div class="stats-inline"><span><strong>Customer:</strong> ${Utils.escapeHtml(customer?.name || 'Walk-in Customer')}</span><span><strong>Payment:</strong> ${Utils.escapeHtml(sale.paymentMethod)}</span></div><div class="table-wrap" style="margin-top:14px;"><table><thead><tr><th>Medicine</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead><tbody>${items.map((i) => `<tr><td>${Utils.escapeHtml(medicines.find((m) => Number(m.id) === Number(i.medicineId))?.name || i.medicineName || '')}</td><td>${i.qty}</td><td>${Utils.currency(i.price)}</td><td>${Utils.currency(i.lineTotal)}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:14px; text-align:right;"><div>Subtotal: <strong>${Utils.currency(sale.subTotal)}</strong></div><div>Discount: <strong>${Utils.currency(sale.discount)}</strong></div><div>Tax: <strong>${sale.tax}%</strong></div><div style="font-size:18px; margin-top:6px;">Grand Total: <strong>${Utils.currency(sale.total)}</strong></div><div>Paid: <strong>${Utils.currency(sale.paidAmount)}</strong> • Change: <strong>${Utils.currency(sale.change)}</strong></div></div></div><div class="actions" style="margin-top:16px;"><button class="btn" type="button" id="print-invoice-btn">Print Invoice</button></div><div class="print-note" style="margin-top:8px;">Uses your browser's print dialog (window.print()).</div>`, onOpen:(modal) => { modal.querySelector('#print-invoice-btn').onclick = () => window.print(); } }); }
    async function renderReturns() { const { sales, saleItems, purchases, purchaseItems, medicines } = await getMasterData(); const state = APP.state.returns; const isSales = state.tab === 'sales'; const salesMatch = sales.filter((s) => !state.search || s.invoiceNumber.toLowerCase().includes(state.search.toLowerCase())); const purchaseMatch = purchases.filter((p) => !state.search || p.invoiceNumber.toLowerCase().includes(state.search.toLowerCase())); setContent(`${pageHeader('Returns', 'Process sales returns and purchase returns with stock updates.')}<div class="tabs"><button class="tab-btn ${isSales ? 'active' : ''}" data-return-tab="sales">Sales Returns</button><button class="tab-btn ${!isSales ? 'active' : ''}" data-return-tab="purchases">Purchase Returns</button></div><div class="card"><div class="toolbar"><div class="search-wrap"><span>🔎</span><input id="returns-search" value="${Utils.escapeHtml(state.search)}" placeholder="Search invoice number" /><button class="icon-btn sm" id="clear-returns-search">✕</button></div></div><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Items</th><th>Total</th><th>Returned</th><th>Actions</th></tr></thead><tbody>${(isSales ? salesMatch : purchaseMatch).length ? (isSales ? salesMatch : purchaseMatch).map((row) => { const items = (isSales ? saleItems : purchaseItems).filter((x) => Number(x[isSales ? 'saleId' : 'purchaseId']) === Number(row.id)); const returned = items.reduce((sum, i) => sum + Number(i.returnedQty || 0), 0); return `<tr><td class="mono">${Utils.escapeHtml(row.invoiceNumber)}</td><td>${Utils.date(row.date)}</td><td>${items.length}</td><td>${Utils.currency(row.total)}</td><td>${returned}</td><td><button class="btn secondary sm" data-open-return="${row.id}">Process Return</button></td></tr>`; }).join('') : `<tr><td colspan="6">${emptyState('No matching invoices found.')}</td></tr>`}</tbody></table></div></div>`); document.querySelectorAll('[data-return-tab]').forEach((el) => el.onclick = () => { state.tab = el.dataset.returnTab; state.search = ''; renderCurrentRoute(); }); document.getElementById('returns-search').oninput = (e) => { state.search = e.target.value; renderCurrentRoute(); }; document.getElementById('clear-returns-search').onclick = () => { state.search = ''; renderCurrentRoute(); }; document.querySelectorAll('[data-open-return]').forEach((el) => { const id = Number(el.dataset.openReturn); el.onclick = () => isSales ? openSaleReturnModal(sales.find((s) => Number(s.id) === id), saleItems.filter((i) => Number(i.saleId) === id), medicines) : openPurchaseReturnModal(purchases.find((p) => Number(p.id) === id), purchaseItems.filter((i) => Number(i.purchaseId) === id), medicines); }); }
    function openSaleReturnModal(sale, items, medicines) { Utils.openModal({ title:`Sales Return • ${sale.invoiceNumber}`, size:'md', content:`<div class="field"><label>Refund Method</label><select name="refundMethod">${PAYMENT_METHODS.map((m) => `<option>${m}</option>`).join('')}</select></div><div class="field"><label>Reason</label><textarea name="reason" required></textarea></div><div class="table-wrap" style="margin-top:14px;"><table><thead><tr><th>Medicine</th><th>Sold</th><th>Already Returned</th><th>Return Qty</th></tr></thead><tbody>${items.map((i) => `<tr><td>${Utils.escapeHtml(medicines.find((m) => Number(m.id) === Number(i.medicineId))?.name || i.medicineName || '')}<input type="hidden" name="saleItemId" value="${i.id}" /></td><td>${i.qty}</td><td>${i.returnedQty || 0}</td><td><input type="number" min="0" max="${Math.max(0, i.qty - (i.returnedQty || 0))}" value="0" data-return-qty="${i.id}" /></td></tr>`).join('')}</tbody></table></div>`, onSubmit:async (fd, form, close) => { const payload = items.map((i) => ({ saleItemId:i.id, qty:form.querySelector(`[data-return-qty="${i.id}"]`).value })); const refund = await processSaleReturn({ saleId:sale.id, items:payload, refundMethod:fd.get('refundMethod'), reason:fd.get('reason') }); close(); Utils.toast(`Sales return processed. Refund ${Utils.currency(refund)}.`, 'success'); renderCurrentRoute(); } }); }
    function openPurchaseReturnModal(purchase, items, medicines) { Utils.openModal({ title:`Purchase Return • ${purchase.invoiceNumber}`, size:'md', content:`<div class="field"><label>Reason</label><textarea name="reason" required></textarea></div><div class="table-wrap" style="margin-top:14px;"><table><thead><tr><th>Medicine</th><th>Purchased</th><th>Already Returned</th><th>Return Qty</th></tr></thead><tbody>${items.map((i) => `<tr><td>${Utils.escapeHtml(medicines.find((m) => Number(m.id) === Number(i.medicineId))?.name || i.medicineName || '')}</td><td>${i.qty}</td><td>${i.returnedQty || 0}</td><td><input type="number" min="0" max="${Math.max(0, i.qty - (i.returnedQty || 0))}" value="0" data-purchase-return-qty="${i.id}" /></td></tr>`).join('')}</tbody></table></div>`, onSubmit:async (fd, form, close) => { const payload = items.map((i) => ({ purchaseItemId:i.id, qty:form.querySelector(`[data-purchase-return-qty="${i.id}"]`).value })); const value = await processPurchaseReturn({ purchaseId:purchase.id, items:payload, reason:fd.get('reason') }); close(); Utils.toast(`Purchase return processed. Value ${Utils.currency(value)}.`, 'success'); renderCurrentRoute(); } }); }
    async function renderCustomers() { const { customers, sales, payments } = await getMasterData(); const state = APP.state.customers; const rows = customers.filter((c) => !state.search || `${c.name} ${c.phone} ${c.email}`.toLowerCase().includes(state.search.toLowerCase())); setContent(`${pageHeader('Customer Management', 'Manage customers, credit balances, profiles, and payments.', `<button class="btn" id="add-customer-btn">Add Customer</button>`)}<div class="card"><div class="toolbar"><div class="search-wrap"><span>🔎</span><input id="customer-search" value="${Utils.escapeHtml(state.search)}" placeholder="Search customer by name, phone, email" /><button class="icon-btn sm" id="clear-customer-search">✕</button></div></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Contact</th><th>Type</th><th>Credit Limit</th><th>Outstanding</th><th>Purchase Count</th><th>Actions</th></tr></thead><tbody>${rows.length ? (await Promise.all(rows.map(async (c) => `<tr><td><strong>${Utils.escapeHtml(c.name)}</strong><div class="small muted">${Utils.escapeHtml(c.gender || '')}</div></td><td>${Utils.escapeHtml(c.phone || '')}<div class="small muted">${Utils.escapeHtml(c.email || '')}</div></td><td>${Utils.escapeHtml(c.type || '')}</td><td>${Utils.currency(c.creditLimit || 0)}</td><td>${(bal => bal > 0 ? `<span class="pill warning">${Utils.currency(bal)}</span>` : '<span class="pill success">Clear</span>')(await computeCustomerBalance(c.id))}</td><td>${sales.filter((s) => Number(s.customerId) === Number(c.id)).length}</td><td><div class="actions"><button class="btn secondary sm" data-view-customer="${c.id}">Profile</button><button class="btn secondary sm" data-edit-customer="${c.id}">Edit</button><button class="btn danger sm" data-delete-customer="${c.id}">Delete</button></div></td></tr>`))).join('') : `<tr><td colspan="7">${emptyState('No customers found.')}</td></tr>`}</tbody></table></div></div>`); document.getElementById('add-customer-btn').onclick = () => openCustomerM rom</label><input type="date" id="report-from" value="${state.from}" /></div><div class="field"><label>To</label><input type="date" id="report-to" value="${state.to}" /></div><div class="field"><label>Medicine</label><select id="report-medicine"><option value="all">All medicines</option>${medicines.map((m) => `<option value="${m.id}" ${String(state.medicineId)===String(m.id)?'selected':''}>${Utils.escapeHtml(m.name)}</option>`).join('')}</select></div><div class="field"><label>Category</label><select id="report-category"><option value="all">All categories</option>${categories.map((c) => `<option value="${c.id}" ${String(state.categoryId)===String(c.id)?'selected':''}>${Utils.escapeHtml(c.name)}</option>`).join('')}</select></div></div></div><div class="grid" style="margin-top:16px;"><div class="card"><div class="page-header"><div><div style="font-size:18px; font-weight:700;">Sales Report</div><div class="page-desc">Filtered by date, medicine, and category</div></div><button class="btn secondary sm" data-export-report="sales">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Medicine</th><th>Category</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${saleRows.length ? saleRows.map((r) => `<tr><td>${Utils.date(r.date)}</td><td>${Utils.escapeHtml(r.invoice)}</td><td>${Utils.escapeHtml(r.medicine)}</td><td>${Utils.escapeHtml(r.category)}</td><td>${r.qty}</td><td>${Utils.currency(r.amount)}</td></tr>`).join('') : `<tr><td colspan="6">${emptyState('No sales report rows.')}</td></tr>`}</tbody></table></div></div><div class="card"><div class="page-header"><div><div style="font-size:18px; font-weight:700;">Purchase Report</div><div class="page-desc">Inbound procurement and batch cost</div></div><button class="btn secondary sm" data-export-report="purchases">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Supplier</th><th>Medicine</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${purchaseRows.length ? purchaseRows.map((r) => `<tr><td>${Utils.date(r.date)}</td><td>${Utils.escapeHtml(r.invoice)}</td><td>${Utils.escapeHtml(r.supplier)}</td><td>${Utils.escapeHtml(r.medicine)}</td><td>${r.qty}</td><td>${Utils.currency(r.amount)}</td></tr>`).join('') : `<tr><td colspan="6">${emptyState('No purchase report rows.')}</td></tr>`}</tbody></table></div></div><div class="card"><div class="page-header"><div><div style="font-size:18px; font-weight:700;">Inventory Valuation</div><div class="page-desc">Stock valuation and retail worth</div></div><button class="btn secondary sm" data-export-report="inventory">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Medicine</th><th>Category</th><th>Stock</th><th>Cost Value</th><th>Retail Value</th></tr></thead><tbody>${inventoryRows.length ? inventoryRows.map((r) => `<tr><td>${Utils.escapeHtml(r.medicine)}</td><td>${Utils.escapeHtml(r.category)}</td><td>${r.stock}</td><td>${Utils.currency(r.valuation)}</td><td>${Utils.currency(r.retailValue)}</td></tr>`).join('') : `<tr><td colspan="5">${emptyState('No inventory rows.')}</td></tr>`}</tbody></table></div></div><div class="grid cols-3"><div class="card"><div class="metric-title">Sales Revenue</div><div class="metric-value">${Utils.currency(totalSales)}</div></div><div class="card"><div class="metric-title">Purchase Cost</div><div class="metric-value">${Utils.currency(totalPurchases)}</div></div><div class="card"><div class="metric-title">Gross Profit</div><div class="metric-value">${Utils.currency(grossProfit)}</div></div><div class="card"><div class="metric-title">Expenses</div><div class="metric-value">${Utils.currency(totalExpenses)}</div></div><div class="card"><div class="metric-title">Additional Income</div><div class="metric-value">${Utils.currency(totalIncome)}</div></div><div class="card"><div class="metric-title">Net Profit / Loss</div><div class="metric-value">${Utils.currency(netProfit)}</div></div></div><div class="card"><di .medicine)}</td><td>${Utils.escapeHtml(r.batch)}</td><td>${Utils.date(r.expiryDate)}</td><td>${r.daysRemaining}</td><td>${r.qty}</td><td>${Utils.currency(r.value)}</td></tr>`).join('') : `<tr><td colspan="6">${emptyState('No expiry rows.')}</td></tr>`}</tbody></table></div></div></div>`); document.getElementById('report-from').onchange = (e) => { state.from = e.target.value; renderCurrentRoute(); }; document.getElementById('report-to').onchange = (e) => { state.to = e.target.value; renderCurrentRoute(); }; document.getElementById('report-medicine').onchange = (e) => { state.medicineId = e.target.value; renderCurrentRoute(); }; document.getElementById('report-category').onchange = (e) => { state.categoryId = e.target.value; renderCurrentRoute(); }; document.querySelectorAll('[data-export-report]').forEach((el) => el.onclick = () => { const type = el.dataset.exportReport; if (type === 'sales') Utils.exportCSV('sales-report.csv', APP.reportCache.saleRows); if (type === 'purchases') Utils.exportCSV('purchase-report.csv', APP.reportCache.purchaseRows); if (type === 'inventory') Utils.exportCSV('inventory-report.csv', APP.reportCache.inventoryRows); if (type === 'expenses') Utils.exportCSV('expense-report.csv', APP.reportCache.expenseRows); if (type === 'expiry') Utils.exportCSV('expiry-report.csv', APP.reportCache.expiryRows); if (type === 'balances') Utils.exportCSV('receivables-payables.csv', APP.reportCache.receivables.concat(APP.reportCache.payables)); }); }

    async function renderUsers() { const users = (await DB.getAll('users')).sort((a,b) => a.username.localeCompare(b.username)); const state = APP.state.users; const rows = users.filter((u) => !state.search || `${u.username} ${u.name} ${u.role}`.toLowerCase().includes(state.search.toLowerCase())); setContent(`${pageHeader('User Management', 'Manage user accounts, roles, permissions, and passwords.', `<button class="btn" id="add-user-btn">Add User</button>`)}<div class="card"><div class="toolbar"><div class="search-wrap"><span>🔎</span><input id="user-search" value="${Utils.escapeHtml(state.search)}" placeholder="Search user" /><button class="icon-btn sm" id="clear-user-search">✕</button></div></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Permissions</th><th>Actions</th></tr></thead><tbody>${rows.length ? rows.map((u) => `<tr><td><strong>${Utils.escapeHtml(u.name || u.username)}</strong><div class="small muted">${Utils.escapeHtml(u.username)}</div></td><td>${Utils.escapeHtml(u.role)}</td><td><span class="pill ${u.status==='Active' ? 'success' : 'danger'}">${Utils.escapeHtml(u.status || 'Active')}</span></td><td class="small">${Utils.escapeHtml((u.permissions || []).join(', '))}</td><td><div class="actions"><button class="btn secondary sm" data-edit-user="${u.id}">Edit</button><button class="btn secondary sm" data-pass-user="${u.id}">Change Password</button>${APP.user?.id !== u.id ? `<button class="btn danger sm" data-delete-user="${u.id}">Delete</button>` : ''}</div></td></tr>`).join('') : `<tr><td colspan="5">${emptyState('No users found.')}</td></tr>`}</tbody></table></div></div>`); document.getElementById('add-user-btn').onclick = () => openUserModal(null); document.getElementById('user-search').oninput = (e) => { state.search = e.target.value; renderCurrentRoute(); }; document.getElementById('clear-user-search').onclick = () => { state.search = ''; renderCurrentRoute(); }; document.querySelectorAll('[data-edit-user]')     async function renderSettings() { const settings = await getSettings(); const data = await DB.exportAll(); setContent(`${pageHeader('Settings', 'Store profile, numbering, appearance, and backup / restore.')}<div class="grid"><div class="card"><form id="settings-form" class="grid" style="gap:18px;"><div class="form-grid cols-3"><div class="field span-2"><label>Store Name</label><input name="storeName" value="${Utils.escapeHtml(settings.storeName || '')}" /></div><div class="field"><label>Currency Symbol</label><input name="currencySymbol" value="${Utils.escapeHtml(settings.currencySymbol || '$')}" /></div><div class="field span-2"><label>Address</label><input name="address" value="${Utils.escapeHtml(settings.address || '')}" /></div><div class="field"><label>Phone</label><input name="phone" value="${Utils.escapeHtml(settings.phone || '')}" /></div><div class="field"><label>Email</label><input name="email" value="${Utils.escapeHtml(settings.email || '')}" /></div><div class="field"><label>Date Format</label><input name="dateFormat" value="${Utils.escapeHtml(settings.dateFormat || '')}" /></div><div class="field"><label>Invoice Prefix</label><input name="invoicePrefix" value="${Utils.escapeHtml(settings.invoicePrefix || 'INV-')}" /></div><div class="field"><label>Next Invoice No.</label><input type="number" name="nextInvoiceNumber" value="${settings.nextInvoiceNumber || 1}" /></div><div class="field"><label>Purchase Prefix</label><input name="purchasePrefix" value="${Utils.escapeHtml(settings.purchasePrefix || 'PO-')}" /></div><div class="field"><label>Next Purchase No.</label><input type="number" name="nextPurchaseNumber" value="${settings.nextPurchaseNumber || 1}" /></div><div class="field"><label>Default Tax %</label><input type="number" step="0.01" name="defaultTax" value="${settings.defaultTax || 0}" /></div><div class="field"><label>Default Discount %</label><input type="number" step="0.01" name="defaultDiscount" value="${settings.defaultDiscount || 0}" /></d     async function renderCurrentRoute() { if (!Auth.canAccess(APP.route)) APP.route = 'dashboard'; Utils.setLoading(true); try { await syncBatchStatuses(); await ROUTES[APP.route](); } catch (error) { setContent(`<div class="card"><strong>Unable to render page</strong><div class="small muted" style="margin-top:8px;">${Utils.escapeHtml(error.message || 'Unknown error')}</div></div>`); } finally { Utils.setLoading(false); } }
    async function renderApp() { APP.settings = await getSettings(); applyTheme(); if (!APP.user) { renderLogin(); return; } renderShell(); await renderCurrentRoute(); }
    async function init() { Utils.setLoading(true); await DB.init(); APP.settings = await getSettings(); applyTheme(); await seedDemoData(); await ensureSystemNotifications(); await Auth.loadSession(); if (APP.user && !Auth.canAccess(APP.route)) APP.route = APP.user.permissions?.[0] || 'dashboard'; await renderApp(); Utils.setLoading(false); }
    init();
  </script>
</body>
