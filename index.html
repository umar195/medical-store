<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Store / Pharmacy Management System</title>
  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --sidebar: #1E293B;
      --sidebar-hover: #334155;
      --bg: #F1F5F9;
      --card: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;
      --success: #16A34A;
      --warning: #D97706;
      --danger: #DC2626;
      --info: #0891B2;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      --radius: 16px;
      --radius-sm: 10px;
      --header-h: 72px;
      --sidebar-w: 260px;
    }
    html[data-theme="dark"] {
      --bg: #0F172A;
      --card: #111827;
      --text: #E5E7EB;
      --muted: #94A3B8;
      --border: #334155;
      --sidebar: #020617;
      --sidebar-hover: #1E293B;
      --shadow: 0 10px 25px rgba(2, 6, 23, 0.35);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    .hidden { display: none !important; }
    .app-shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
    .sidebar { background: var(--sidebar); color: #fff; padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .brand { display: flex; gap: 12px; align-items: center; padding: 10px 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 18px; }
    .brand-logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #3B82F6, #1D4ED8); display: grid; place-items: center; font-size: 22px; box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35); }
    .brand-title { font-size: 17px; font-weight: 700; line-height: 1.2; }
    .brand-sub { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 2px; }
    .nav-group { margin-bottom: 16px; }
    .nav-label { color: rgba(255,255,255,0.55); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 10px 12px 6px; }
    .nav-item { display: flex; gap: 12px; align-items: center; width: 100%; border: 0; background: transparent; color: rgba(255,255,255,0.9); padding: 12px 14px; border-radius: 12px; cursor: pointer; margin-bottom: 4px; transition: .2s ease; text-align: left; }
    .nav-item:hover { background: var(--sidebar-hover); }
    .nav-item.active { background: linear-gradient(135deg, rgba(59,130,246,.28), rgba(37,99,235,.2)); box-shadow: inset 0 0 0 1px rgba(147,197,253,.25); }
    .nav-item .icon { width: 20px; text-align: center; }
    .main { min-width: 0; display: flex; flex-direction: column; }
    .header { height: var(--header-h); background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 20; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-title { font-size: 20px; font-weight: 700; }
    .header-sub { color: var(--muted); font-size: 13px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn, .btn { border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; transition: .2s ease; }
    .icon-btn { background: var(--bg); color: var(--text); min-width: 42px; display: inline-flex; justify-content: center; align-items: center; position: relative; }
    .btn { background: var(--primary); color: #fff; font-weight: 600; }
    .btn:hover { background: var(--primary-dark); }
    .btn.secondary { background: #E2E8F0; color: #0F172A; }
    html[data-theme="dark"] .btn.secondary { background: #1F2937; color: #E5E7EB; }
    .btn.success { background: var(--success); }
    .btn.warning { background: var(--warning); }
    .btn.danger { background: var(--danger); }
    .btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); }
    .icon-btn:hover, .btn.secondary:hover, .btn.ghost:hover { filter: brightness(.98); }
    .badge-count { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 999px; background: var(--danger); color: #fff; display: grid; place-items: center; font-size: 11px; padding: 0 5px; font-weight: 700; }
    .user-chip { display: flex; align-items: center; gap: 10px; background: var(--bg); padding: 8px 12px; border-radius: 14px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #60A5FA, #2563EB); color: #fff; display: grid; place-items: center; font-weight: 700; }
    .content { padding: 22px; min-width: 0; }
    .page-header { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .page-title { font-size: 24px; font-weight: 700; }
    .page-desc { color: var(--muted); margin-top: 4px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
    .grid { display: grid; gap: 16px; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .grid.cols-5 { grid-template-columns: repeat(5, minmax(0,1fr)); }
    .metric-card { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .metric-title { color: var(--muted); font-size: 13px; }
    .metric-value { font-size: 28px; font-weight: 800; margin-top: 8px; }
    .metric-sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .metric-icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; background: rgba(37,99,235,.1); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    .field, .field textarea, .field select, .field input { width: 100%; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    input, select, textarea { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; outline: none; transition: border-color .2s ease, box-shadow .2s ease; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    textarea { min-height: 92px; resize: vertical; }
    .search-wrap { display: flex; align-items: center; gap: 8px; min-width: 260px; flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0 10px; }
    .search-wrap input { border: 0; background: transparent; padding-left: 0; box-shadow: none !important; }
    .table-wrap { overflow: auto; border-radius: 14px; border: 1px solid var(--border); background: var(--card); }
    table { width: 100%; border-collapse: collapse; min-width: 860px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; font-size: 13px; }
    th { background: rgba(148,163,184,.08); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    tr:nth-child(even) td { background: rgba(148,163,184,.03); }
    tbody tr:hover td { background: rgba(37,99,235,.05); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn.sm, .icon-btn.sm { padding: 7px 10px; border-radius: 10px; font-size: 12px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .pill.success { background: rgba(22,163,74,.12); color: var(--success); }
    .pill.warning { background: rgba(217,119,6,.12); color: var(--warning); }
    .pill.danger { background: rgba(220,38,38,.12); color: var(--danger); }
    .pill.info { background: rgba(8,145,178,.12); color: var(--info); }
    .pill.muted { background: rgba(148,163,184,.14); color: var(--muted); }
    .split { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .empty { padding: 42px 20px; text-align: center; color: var(--muted); }
    .empty .emoji { font-size: 42px; margin-bottom: 12px; }
    .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .stats-inline { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
    .login-screen { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top left, rgba(37,99,235,.16), transparent 35%), var(--bg); padding: 20px; }
    .login-card { width: min(960px, 100%); display: grid; grid-template-columns: 1.1fr .9fr; background: var(--card); border: 1px solid var(--border); border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); }
    .login-hero { padding: 46px; background: linear-gradient(135deg, #1D4ED8, #2563EB 45%, #60A5FA); color: #fff; position: relative; }
    .login-hero h1 { font-size: 34px; margin: 18px 0 12px; }
    .login-hero p { opacity: .9; line-height: 1.6; }
    .login-bullets { margin-top: 26px; display: grid; gap: 12px; }
    .login-bullets div { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); padding: 14px 16px; border-radius: 14px; }
    .login-form { padding: 42px; display: flex; flex-direction: column; justify-content: center; }
    .login-form h2 { margin: 0 0 8px; }
    .login-form .hint { color: var(--muted); margin-bottom: 22px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .form-grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .form-grid.cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .form-grid .span-2 { grid-column: span 2; }
    .form-grid .span-3 { grid-column: span 3; }
    .form-grid .span-4 { grid-column: span 4; }
    .modal-root, .toast-root, .confirm-root { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
    .modal-backdrop, .confirm-backdrop { position: absolute; inset: 0; background: rgba(15,23,42,.6); display: grid; place-items: center; padding: 18px; pointer-events: auto; }
    .modal { width: min(1000px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: var(--card); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow); }
    .modal.sm { width: min(520px, 100%); }
    .modal.md { width: min(760px, 100%); }
    .modal-header, .modal-footer { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; background: var(--card); z-index: 2; }
    .modal-footer { border-bottom: 0; border-top: 1px solid var(--border); bottom: 0; top: auto; justify-content: flex-end; }
    .modal-body { padding: 20px; }
    .toast-root { display: flex; justify-content: flex-end; align-items: flex-start; padding: 18px; }
    .toast-stack { display: grid; gap: 10px; width: min(400px, calc(100vw - 36px)); pointer-events: auto; }
    .toast { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--primary); box-shadow: var(--shadow); border-radius: 14px; padding: 14px 16px; animation: slideIn .2s ease; }
    .toast.success { border-left-color: var(--success); }
    .toast.warning { border-left-color: var(--warning); }
    .toast.danger { border-left-color: var(--danger); }
    @keyframes slideIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .notification-panel { position: absolute; top: 64px; right: 20px; width: min(420px, calc(100vw - 40px)); background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); z-index: 30; overflow: hidden; }
    .notification-item { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; cursor: pointer; }
    .notification-item.unread { background: rgba(37,99,235,.06); }
    .notification-item:last-child { border-bottom: 0; }
    .spinner-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.25); display: grid; place-items: center; z-index: 80; visibility: hidden; opacity: 0; transition: .2s ease; }
    .spinner-overlay.show { visibility: visible; opacity: 1; }
    .spinner { width: 54px; height: 54px; border-radius: 50%; border: 5px solid rgba(255,255,255,.28); border-top-color: #fff; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chart-wrap { overflow: auto; }
    .svg-chart text { fill: var(--muted); font-size: 11px; }
    .invoice-preview { border: 1px dashed var(--border); border-radius: 16px; padding: 18px; background: rgba(148,163,184,.03); }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tab-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 10px 14px; border-radius: 12px; cursor: pointer; font-weight: 600; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pos-layout { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
    .result-list { display: grid; gap: 12px; }
    .medicine-card { border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; justify-content: space-between; gap: 12px; background: rgba(148,163,184,.04); }
    .list-stack { display: grid; gap: 12px; }
    .mini-card { border: 1px solid var(--border); border-radius: 14px; padding: 12px; background: rgba(148,163,184,.04); }
    .right { text-align: right; }
    .logo-preview { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; border: 1px solid var(--border); background: rgba(148,163,184,.08); }
    .print-note { color: var(--muted); font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width: 1200px) { .grid.cols-4, .grid.cols-5, .split, .pos-layout { grid-template-columns: 1fr; } }
    @media (max-width: 960px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
      .login-card { grid-template-columns: 1fr; }
      .form-grid, .form-grid.cols-3, .form-grid.cols-4, .grid.cols-2, .grid.cols-3, .grid.cols-4, .grid.cols-5 { grid-template-columns: 1fr; }
      .form-grid .span-2, .form-grid .span-3, .form-grid .span-4 { grid-column: span 1; }
      .header { height: auto; padding: 14px; flex-wrap: wrap; }
      .content { padding: 14px; }
    }
    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: absolute; inset: 0; background: #fff; color: #000; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root" class="modal-root"></div>
  <div id="confirm-root" class="confirm-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="spinner" class="spinner-overlay"><div class="spinner"></div></div>
  <script>
    const DB_NAME = 'medical_store_offline_app';
    const DB_VERSION = 1;
    const STORE_NAMES = ['medicines','batches','categories','manufacturers','suppliers','customers','doctors','sales','saleItems','purchases','purchaseItems','expenses','income','users','settings','auditLog','stockMovements','notifications','heldSales','payments'];
    const DEFAULT_SETTINGS = { id:'app', initialized:false, storeName:'MediCare Pharmacy', address:'221B Health Avenue, Central City', phone:'+1 555-0199', email:'contact@medicare.local', logo:'', currencySymbol:'$', dateFormat:'YYYY-MM-DD', invoicePrefix:'INV-', purchasePrefix:'PO-', nextInvoiceNumber:11, nextPurchaseNumber:7, defaultTax:5, defaultDiscount:0, lowStockThreshold:15, expiryAlertDays:30, theme:'light' };
    const ROLES = ['Super Admin','Admin','Pharmacist','Cashier','Inventory Manager','Accountant'];
    const PERMISSION_GROUPS = { dashboard:'Dashboard', pos:'POS / Sales', medicines:'Medicines', batches:'Batches', inventory:'Inventory', purchases:'Purchases', returns:'Returns', customers:'Customers', suppliers:'Suppliers', expiry:'Expiry', expenses:'Expenses', income:'Income', reports:'Reports', users:'Users', audit:'Audit Log', settings:'Settings' };
    const ROLE_PERMISSIONS = { 'Super Admin': Object.keys(PERMISSION_GROUPS), 'Admin': Object.keys(PERMISSION_GROUPS), 'Pharmacist': ['dashboard','pos','medicines','batches','inventory','customers','expiry','reports'], 'Cashier': ['dashboard','pos','customers','returns','reports'], 'Inventory Manager': ['dashboard','medicines','batches','inventory','purchases','suppliers','expiry','reports'], 'Accountant': ['dashboard','customers','suppliers','expenses','income','reports','audit'] };
    const DOSAGE_FORMS = ['Tablet','Capsule','Syrup','Injection','Cream','Ointment','Drops','Inhaler','Powder','Sachet','Suspension','Lotion','Gel','Spray','Other'];
    const EXPENSE_CATEGORIES = ['Rent','Electricity','Salaries','Internet','Transportation','Maintenance','Supplies','Marketing','Taxes','Miscellaneous'];
    const PAYMENT_METHODS = ['Cash','Card','Bank Transfer'];
    const GENDERS = ['Male','Female','Other'];
    const CUSTOMER_TYPES = ['Walk-in','Regular','Wholesale','Clinic'];
    const NAV_ITEMS = [
      { id:'dashboard', label:'Dashboard', icon:'🏠' }, { id:'pos', label:'POS / Sales', icon:'🧾' }, { id:'medicines', label:'Medicines', icon:'💊' }, { id:'batches', label:'Batches', icon:'📦' }, { id:'inventory', label:'Inventory', icon:'📚' }, { id:'purchases', label:'Purchases', icon:'🛒' }, { id:'returns', label:'Returns', icon:'↩️' }, { id:'customers', label:'Customers', icon:'👥' }, { id:'suppliers', label:'Suppliers', icon:'🏭' }, { id:'expiry', label:'Expiry', icon:'⏰' }, { id:'expenses', label:'Expenses', icon:'💸' }, { id:'income', label:'Income', icon:'💰' }, { id:'reports', label:'Reports', icon:'📈' }, { id:'users', label:'Users', icon:'🔐' }, { id:'audit', label:'Audit Log', icon:'🕵️' }, { id:'settings', label:'Settings', icon:'⚙️' }
    ];
    const APP = { db:null, settings:{ ...DEFAULT_SETTINGS }, user:null, route:'dashboard', notificationsOpen:false, state:{ medicines:{ search:'', category:'all', page:1 }, batches:{ medicineId:'all', search:'' }, inventory:{ category:'all', stockStatus:'all', expiryStatus:'all' }, pos:{ search:'', customerId:'walk-in', discount:0, tax:DEFAULT_SETTINGS.defaultTax, paymentMethod:'Cash', paidAmount:0, cashReceived:0 }, returns:{ tab:'sales', search:'' }, customers:{ search:'' }, suppliers:{ search:'' }, purchases:{ search:'', supplierId:'all' }, expenses:{ month:'' }, income:{ month:'' }, reports:{ from:'', to:'', medicineId:'all', categoryId:'all' }, users:{ search:'' }, audit:{ search:'' } }, posCart:[], reportCache:{}, currentSelection:{} };
    const DB = {
      async init() { return new Promise((resolve, reject) => { const request = indexedDB.open(DB_NAME, DB_VERSION); request.onerror = () => reject(request.error); request.onupgradeneeded = () => { const db = request.result; STORE_NAMES.forEach((name) => { if (!db.objectStoreNames.contains(name)) { const store = db.createObjectStore(name, { keyPath:'id', autoIncrement:true }); if (name === 'users') store.createIndex('username', 'username', { unique:true }); if (name === 'medicines') store.createIndex('code', 'code', { unique:true }); if (name === 'batches') { store.createIndex('medicineId', 'medicineId'); store.createIndex('batchNumber', 'batchNumber'); } } }); }; request.onsuccess = () => { APP.db = request.result; resolve(APP.db); }; }); },
      req(request) { return new Promise((resolve, reject) => { request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); },
      store(name, mode='readonly') { return APP.db.transaction(name, mode).objectStore(name); },
      async add(name, value) { return this.req(this.store(name, 'readwrite').add(value)); },
      async put(name, value) { return this.req(this.store(name, 'readwrite').put(value)); },
      async get(name, id) { return this.req(this.store(name).get(id)); },
      async getAll(name) { return this.req(this.store(name).getAll()); },
      async delete(name, id) { return this.req(this.store(name, 'readwrite').delete(id)); },
      async clear(name) { return this.req(this.store(name, 'readwrite').clear()); },
      async bulkAdd(name, values) { const tx = APP.db.transaction(name, 'readwrite'); const store = tx.objectStore(name); values.forEach((v) => store.add(v)); return new Promise((resolve, reject) => { tx.oncomplete = () => resolve(true); tx.onerror = () => reject(tx.error); }); },
      async exportAll() { const data = {}; for (const store of STORE_NAMES) data[store] = await this.getAll(store); return { exportedAt:new Date().toISOString(), version:1, data }; },
      async importAll(payload) { for (const store of STORE_NAMES) await this.clear(store); for (const store of STORE_NAMES) { const rows = payload.data?.[store] || []; if (rows.length) await this.bulkAdd(store, rows); } }
    };
    const Auth = {
      async hashPassword(password) { const encoded = new TextEncoder().encode(password); const hashBuffer = await crypto.subtle.digest('SHA-256', encoded); return Array.from(new Uint8Array(hashBuffer)).map((b) => b.toString(16).padStart(2, '0')).join(''); },
      async login(username, password) { const users = await DB.getAll('users'); const hash = await this.hashPassword(password); const user = users.find((u) => u.username === username && u.passwordHash === hash && u.status !== 'Disabled'); if (!user) throw new Error('Invalid username or password.'); sessionStorage.setItem('medical-store-session', JSON.stringify({ id:user.id, username:user.username, role:user.role, name:user.name })); APP.user = user; await addAudit('Login', 'Authentication', 'User signed in'); return user; },
      async loadSession() { try { const raw = sessionStorage.getItem('medical-store-session'); if (!raw) return null; const session = JSON.parse(raw); const user = await DB.get('users', session.id); if (!user) return null; APP.user = user; return user; } catch { return null; } },
      logout() { sessionStorage.removeItem('medical-store-session'); APP.user = null; APP.posCart = []; APP.route = 'dashboard'; renderApp(); },
      canAccess(route) { if (!APP.user) return false; const permissions = APP.user.permissions?.length ? APP.user.permissions : ROLE_PERMISSIONS[APP.user.role] || []; return permissions.includes(route); }
    };
    const Utils = {
      currency(value) { const amount = Number(value || 0); return `${APP.settings.currencySymbol || '$'}${amount.toFixed(2)}`; },
      date(value) { if (!value) return '-'; const d = new Date(value); if (Number.isNaN(d.getTime())) return value; return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'2-digit' }); },
      datetime(value) { if (!value) return '-'; return new Date(value).toLocaleString(); },
      today() { return new Date().toISOString().slice(0, 10); },
      daysUntil(value) { const ms = new Date(value).setHours(0,0,0,0) - new Date().setHours(0,0,0,0); return Math.ceil(ms / 86400000); },
      parseNumber(value) { const n = Number(value); return Number.isFinite(n) ? n : 0; },

    async function createSale(payload, { seed=false } = {}) { const items = payload.items || []; if (!items.length) throw new Error('Add at least one sale item.'); const [medicines, allBatches] = await Promise.all([DB.getAll('medicines'), DB.getAll('batches')]); let subTotal = 0; const prepared = []; for (const item of items) { const medicine = medicines.find((m) => Number(m.id) === Number(item.medicineId)); if (!medicine) throw new Error('Medicine not found.'); const qty = Utils.parseNumber(item.qty); const availableBatches = getAvailableBatchesForMedicine(item.medicineId, item.preferredBatchId, allBatches); const totalAvailable = availableBatches.reduce((sum, b) => sum + Utils.parseNumber(b.currentQty), 0); if (totalAvailable < qty) throw new Error(`Not enough stock for ${medicine.name}.`); const price = Utils.parseNumber(item.price || medicine.retailPrice); const lineTotal = qty * price; subTotal += lineTotal; prepared.push({ ...item, qty, price, lineTotal, medicine, availableBatches }); } const discount = Utils.parseNumber(payload.discount); const tax = Utils.parseNumber(payload.tax); const total = subTotal - discount + (subTotal - discount) * tax / 100; const paidAmount = Math.min(Utils.parseNumber(payload.paidAmount), total); const dueAmount = total - paidAmount; const invoiceNumber = payload.invoiceNumber || await nextDocumentNumber('sale'); const sale = { invoiceNumber, customerId:payload.customerId === 'walk-in' || !payload.customerId ? null : Number(payload.customerId), date:payload.date || Utils.today(), subTotal, discount, tax, total, paidAmount, dueAmount, paymentMethod:payload.paymentMethod || 'Cash', cashReceived:Utils.parseNumber(payload.cashReceived), change:Math.max(0, Utils.parseNumber(payload.cashReceived) - total), returnTotal:Number(payload.returnTotal || 0), status:'Completed', userId:payload.userId || APP.user?.id || null, createdAt:new Date().toISOString() }; const saleId = await DB.add('sales', sale); for (const item of prepared) { let rema     function pageHeader(title, desc, actions='') { return `<div class="page-header"><div><div class="page-title">${Utils.escapeHtml(title)}</div><div class="page-desc">${Utils.escapeHtml(desc)}</div></div><div class="actions">${actions}</div></div>`; }

    function metricCard(title, value, icon, sub) { return `<div class="card metric-card"><div><div class="metric-title">${Utils.escapeHtml(String(title))}</div><div class="metric-value">${Utils.escapeHtml(String(value))}</div><div class="metric-sub">${Utils.escapeHtml(String(sub))}</div></div><div class="metric-icon">${icon}</div></div>`; }
    function renderBarChart(data, formatter) { const max = Math.max(...data.map((d) => Number(d.value || 0)), 1); const width = 560, height = 240, padding = 36, barWidth = Math.max(24, Math.floor((width - padding * 2) / Math.max(data.length, 1) - 12)); const bars = data.map((d, i) => { const x = padding + i * ((width - padding * 2) / Math.max(data.length, 1)) + 6; const h = ((Number(d.value || 0) / max) * (height - padding * 2)); const y = height - padding - h; return `<rect x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="8" fill="#2563EB"></rect><text x="${x + barWidth/2}" y="${height - 12}" text-anchor="middle">${Utils.escapeHtml(String(d.label))}</text><text x="${x + barWidth/2}" y="${y - 8}" text-anchor="middle">${Utils.escapeHtml(String(formatter(Number(d.value || 0))))}</text>`; }).join(''); return `<div class="chart-wrap"><svg class="svg-chart" width="100%" viewBox="0 0 ${width} ${height}"><line x1="${padding}" y1="${height-padding}" x2="${width-padding}" y2="${height-padding}" stroke="${APP.settings.theme === 'dark' ? '#475569' : '#CBD5E1'}" />${bars}</svg></div>`; }

    function renderHeaderMeta() { if (!APP.user) return; const titleEl = document.getElementById('store-name-label'); if (titleEl) titleEl.textContent = APP.settings.storeName || 'Medical Store'; const userNameEl = document.getElementById('header-user-name'); const userRoleEl = document.getElementById('header-user-role'); if (userNameEl) userNameEl.textContent = APP.user.name || APP.user.username; if (userRoleEl) userRoleEl.textContent = APP.user.role; const avatar = document.getElementById('header-avatar'); if (avatar) avatar.textContent = (APP.user.name || APP.user.username || 'U').slice(0,1).toUpperCase(); DB.getAll('notifications').then((rows) => { const unread = rows.filter((n) => !n.read).length; const badge = document.getElementById('notif-count'); if (badge) { badge.textContent = unread; badge.classList.toggle('hidden', unread === 0); } }); }
    async function renderNotificationPanel() { const panel = document.getElementById('notification-panel'); if (!panel) return; if (!APP.notificationsOpen) { panel.classList.add('hidden'); panel.innerHTML = ''; return; } const rows = (await DB.getAll('notifications')).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)); panel.classList.remove('hidden'); panel.innerHTML = `<div class="modal-header" style="position:static;"><strong>Notifications</strong><div class="actions"><button class="btn secondary sm" id="mark-all-read">Mark all read</button></div></div>${rows.length ? rows.map((n) => `<div class="notification-item ${n.read ? '' : 'unread'}" data-notif-id="${n.id}"><div style="font-size:20px;">${n.type === 'stock' ? '📦' : n.type === 'expiry' ? '⏰' : n.type === 'receivable' ? '💳' : n.type === 'payable' ? '🏦' : '🔔'}</div><div><div style="font-weight:700;">${Utils.escapeHtml(n.title)}</div><div class="small muted" style="margin-top:4px;">${Utils.escapeHtml(n.message)}</div><div class="small muted" style="margin-top:6px;">${Utils.datetime(n.createdAt)}</div></div></div>`).join('') : emptyState('No notifications yet.')}`; const markAll = panel.querySelector('#mark-all-read'); if (markAll) markAll.onclick = async () => { await markNotificationsRead(); await renderNotificationPanel(); }; panel.querySelectorAll('[data-notif-id]').forEach((el) => el.onclick = async () => { await markNotificationsRead([Number(el.dataset.notifId)]); await renderNotificationPanel(); }); }
    function renderLogin() { document.getElementById('app').innerHTML = `<div class="login-screen"><div class="login-card"><div class="login-hero"><div class="brand-logo">💊</div><h1>Medical Store Management</h1><p>Offline-first pharmacy POS and inventory system with IndexedDB persistence, sales, purchases, reports, stock alerts, and backup tools.</p><div class="login-bullets"><div><strong>100% Offline</strong><br><span class="small">Works directly from file:// with no internet dependencies.</span></div><div><strong>Batch & Expiry Control</strong><br><span class="small">Track batches, stock movements, and near-expiry medicine alerts.</span></div><div><strong>Secure Access</strong><br><span class="small">SHA-256 password hashing and session-based authentication.</span></div></div></div><div class="login-form"><h2>Sign in</h2><form id="login-form" class="grid" style="gap:16px;"><div class="field"><label>Username</label><input name="username" autocomplete="username" required /></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required /></div><button class="btn" type="submit">Login</button></form></div></div></div>`; document.getElementById('login-form').onsubmit = async (e) => { e.preventDefault(); Utils.setLoading(true); try { const data = new FormData(e.currentTarget); await Auth.login(data.get('username'), data.get('password')); APP.route = Auth.canAccess('dashboard') ? 'dashboard' : (APP.user.permissions?.[0] || 'dashboard'); Utils.toast('Login successful.', 'success'); renderApp(); } catch (error) { Utils.toast(error.message, 'danger'); } finally { Utils.setLoading(false); } }; }
    function renderShell() { const nav = NAV_ITEMS.filter((item) => Auth.canAccess(item.id)).map((item) => `<button class="nav-item ${APP.route === item.id ? 'active' : ''}" data-route="${item.id}"><span class="icon">${item.icon}</span><span>${item.label}</span></button>`).join(''); document.getElementById('app').innerHTML = `<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-logo">💊</div><div><div class="brand-title" id="store-name-label">${Utils.escapeHtml(APP.settings.storeName)}</div><div class="brand-sub">Offline Pharmacy Suite</div></div></div><div class="nav-group"><div class="nav-label">Navigation</div>${nav}</div></aside><main class="main"><div class="header"><div class="header-left"><div><div class="header-title">${NAV_ITEMS.find((n) => n.id === APP.route)?.label || 'Dashboard'}</div><div class="header-sub">Professional pharmacy operations dashboard</div></div></div><div class="header-right"><div style="position:relative;"><button class="icon-btn" id="notif-btn">🔔 <span id="notif-count" class="badge-count hidden">0</span></button><div id="notification-panel" class="notification-panel hidden"></div></div><button class="icon-btn" id="theme-toggle">${APP.settings.theme === 'dark' ? '🌙' : '☀️'}</button><div class="user-chip"><div class="avatar" id="header-avatar">A</div><div><div style="font-weight:700;" id="header-user-name"></div><div class="small muted" id="header-user-role"></div></div></div><button class="btn secondary" id="logout-btn">Logout</button></div></div><div class="content" id="content"></div></main></div>`; document.querySelectorAll('[data-route]').forEach((el) => el.onclick = () => { APP.route = el.dataset.route; APP.notificationsOpen = false; renderApp(); }); document.getElementById('logout-btn').onclick = () => Auth.logout(); document.getElementById('theme-toggle').onclick = async () => { APP.settings.theme = APP.settings.theme === 'dark' ? 'light' : 'dark'; await saveSettings({ theme:APP.settings.theme }); renderApp(); }; document.getElementById('notif-btn').onclick = async (e) => { e.stopPropagation(); APP.notificationsOpen = !APP.notificationsOpen; await renderNotificationPanel(); }; document.addEventListener('click', () => { if (APP.notificationsOpen) { APP.notificationsOpen = false; const panel = document.getElementById('notification-panel'); if (panel) panel.classList.add('hidden'); } }, { once:true }); renderHeaderMeta(); }
    async function renderDashboard() { const { medicines, batches, sales, saleItems, expenses, suppliers, customers } = await getMasterData(); const stockMap = getMedicineStockMap(medicines, batches); const today = Utils.today(); const now = new Date(); const weeklyStart = new Date(now); weeklyStart.setDate(now.getDate() - 6); const monthlyKey = today.slice(0, 7); const todaySales = sales.filter((s) => s.date === today).reduce((sum, s) => sum + Number(s.total || 0), 0); const weeklySales = sales.filter((s) => new Date(s.date) >= weeklyStart).reduce((sum, s) => sum + Number(s.total || 0), 0); const monthlySales = sales.filter((s) => String(s.date).startsWith(monthlyKey)).reduce((sum, s) => sum + Number(s.total || 0), 0); const lowStock = medicines.filter((m) => (stockMap[m.id]?.qty || 0) > 0 && (stockMap[m.id]?.qty || 0) <= Number(m.reorderLevel || APP.settings.lowStockThreshold)).length; const outOfStock = medicines.filter((m) => (stockMap[m.id]?.qty || 0) === 0).length; const expiringSoon = batches.filter((b) => batchStatusFor(b) === 'Active' && Utils.daysUntil(b.expiryDate) <= APP.settings.expiryAlertDays).length; const expired = batches.filter((b) => batchStatusFor(b) === 'Expired').length; const todaysExpenses = expenses.filter((e) => e.date === today).reduce((sum, e) => sum + Number(e.amount || 0), 0); let receivables = 0; for (const c of customers) receivables += Math.max(0, await computeCustomerBalance(c.id)); let payables = 0; for (const s of suppliers) payables += Math.max(0, await computeSupplierBalance(s.id)); const chartDays = Array.from({ length:7 }).map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); const key = d.toISOString().slice(0,10); return { label:d.toLocaleDateString(undefined, { weekday:'short' }), value:sales.filter((x) => x.date === key).reduce((sum, x) => sum + Number(x.total || 0), 0) }; }); const topMap = {}; saleItems.forEach((row) => { topMap[row.medicineName] = (topMap[row.medicineName] || 0) + Number(row.qty || 0); }); const topMedicines = Object.entries(topMap).map(([label, value]) => ({ label, value })).sort((a,b) => b.value - a.value).slice(0,5); const notifications = (await DB.getAll('notifications')).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 8); const outstandingCustomers = (await Promise.all(customers.map(async (c) => ({ name:c.name, balance:await computeCustomerBalance(c.id) })))).filter((x) => x.balance > 0).slice(0,6); setContent(`${pageHeader('Dashboard', 'Overview of sales, inventory, receivables, expenses, and alerts.')}<div class="grid cols-4">${metricCard("Today's Sales", Utils.currency(todaySales), '🧾', 'Sales completed today')}${metricCard('Weekly Sales', Utils.currency(weeklySales), '📅', 'Last 7 days turnover')}${metricCard('Monthly Sales', Utils.currency(monthlySales), '📈', 'Current month turnover')}${metricCard('Medicines', medicines.length, '💊', `${lowStock} low stock / ${outOfStock} out`)}${metricCard('Expiry Alerts', `${expiringSoon} / ${expired}`, '⏰', 'Soon expiring / expired batches')}${metricCard('Receivables', Utils.currency(receivables), '💳', 'Outstanding customer balance')}${metricCard('Payables', Utils.currency(payables), '🏦', 'Outstanding supplier balance')}${metricCard("Today's Expenses", Utils.currency(todaysExpenses), '💸', 'Operating expense today')}</div><div class="split" style="margin-top:16px;"><div class="grid"><div class="card"><div class="page-header" style="margin-bottom:12px;"><div><div style="font-size:18px; font-weight:700;">Sales Over 7 Days</div><div class="page-desc">Revenue trend for the past week</div></div></div>${renderBarChart(chartDays, Utils.currency)}</div><div class="card"><div class="page-header" style="margin-bottom:12px;"><div><div style="font-size:18px; font-weight:700;">Top 5 Medicines</div><div class="page-desc">Best-selling items by quantity</div></div></div>${renderBarChart(topMedicines, (n) => n)}</div></div><div class="grid"><div class="card"><div style="font-size:18px; font-weight:700;">Notifications</div><div class="page-desc" style="margin-bottom:14px;">Latest system alerts and reminders</div><div class="list-stack">${notifications.length ? notifications.map((n) => `<div class="mini-card"><div style="display:flex;justify-content:space-between;gap:10px;"><strong>${Utils.escapeHtml(n.title)}</strong><span class="pill ${n.read ? 'muted' : 'info'}">${n.read ? 'Read' : 'Unread'}</span></div><div class="small muted" style="margin-top:8px; line-height:1.6;">${Utils.escapeHtml(n.message)}</div><div class="small muted" style="margin-top:8px;">${Utils.datetime(n.createdAt)}</div></div>`).join('') : emptyState('No notifications.')}</div></div><div class="card"><div style="font-size:18px; font-weight:700;">Attention Summary</div><div class="list-stack" style="margin-top:14px;"><div class="mini-card"><strong>Low stock medicines</strong><div class="small muted" style="margin-top:6px;">${medicines.filter((m) => (stockMap[m.id]?.qty || 0) <= Number(m.reorderLevel || APP.settings.lowStockThreshold)).slice(0,6).map((m) => `${m.name} (${stockMap[m.id]?.qty || 0})`).join(', ') || 'None'}</div></div><div class="mini-card"><strong>Expiring soon</strong><div class="small muted" style="margin-top:6px;">${batches.filter((b) => batchStatusFor(b) === 'Active' && Utils.daysUntil(b.expiryDate) <= APP.settings.expiryAlertDays).slice(0,6).map((b) => `${medicines.find((m) => Number(m.id) === Number(b.medicineId))?.name || 'Medicine'} (${b.batchNumber})`).join(', ') || 'None'}</div></div><div class="mini-card"><strong>Outstanding customer balances</strong><div class="small muted" style="margin-top:6px;">${outstandingCustomers.map((x) => `${x.name} ${Utils.currency(x.balance)}`).join(', ') || 'None'}</div></div></div></div></div></div>`); }
    async function renderMedicines() { const { medicines, categories, manufacturers, suppliers, batches } = await getMasterData(); const stockMap = getMedicineStockMap(medicines, batches); const state = APP.state.medicines; const filtered = medicines.filter((m) => { const matchSearch = !state.search || [m.name, m.genericName, m.brand, m.code].join(' ').toLowerCase().includes(state.search.toLowerCase()); const matchCategory = state.category === 'all' || Number(m.categoryId) === Number(state.category); return matchSearch && matchCategory; }).sort((a,b) => a.name.localeCompare(b.name)); const perPage = 10; const pages = Math.max(1, Math.ceil(filtered.length / perPage)); if (state.page > pages) state.page = pages; const rows = filtered.slice((state.page - 1) * perPage, state.page * perPage); setContent(`${pageHeader('Medicine Management', 'Maintain product master data, pricing, and stock profile.', `<button class="btn" id="add-medicine-btn">Add Medicine</button>`)}<div class="card"><div class="toolbar"><div class="search-wrap"><span>🔎</span><input id="medicine-search" placeholder="Search by name, code, brand, generic" value="${Utils.escapeHtml(state.search)}" /><button class="icon-btn sm" id="clear-med-search">✕</button></div><select id="medicine-category-filter"><option value="all">All categories</option>${categories.map((c) => `<option value="${c.id}" ${String(state.category)===String(c.id)?'selected':''}>${Utils.escapeHtml(c.name)}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Brand</th><th>Manufacturer</th><th>Pricing</th><th>Current Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.length ? rows.map((m) => `<tr><td class="mono">${Utils.escapeHtml(m.code)}</td><td><strong>${Utils.escapeHtml(m.name)}</strong><div class="small muted">${Utils.escapeHtml(m.genericName)} • ${Utils.escapeHtml(m.strength || '')} • ${Utils.escapeHtml(m.dosageForm || '')}</div></td><td>${Utils.escapeHtml(categories.find((c) => Number(c.id) === Number(m.categoryId))?.name || m.category || '')}</td><td>${Utils.escapeHtml(m.brand || '')}</td><td>${Utils.escapeHtml(manufacturers.find((x) => Number(x.id) === Number(m.manufacturerId))?.name || m.manufacturer || '')}</td><td><div>Retail: <strong>${Utils.currency(m.retailPrice)}</strong></div><div class="small muted">Min: ${Utils.currency(m.minSellingPrice)} • Tax ${m.tax || 0}%</div></td><td><strong>${stockMap[m.id]?.qty || 0}</strong> ${Utils.escapeHtml(m.unit || '')}</td><td>${(stockMap[m.id]?.qty || 0) === 0 ? '<span class="pill danger">Out of stock</span>' : (stockMap[m.id]?.qty || 0) <= Number(m.reorderLevel || APP.settings.lowStockThreshold) ? '<span class="pill warning">Low stock</span>' : '<span class="pill success">In stock</span>'}</td><td><div class="actions"><button class="btn secondary sm" data-edit-medicine="${m.id}">Edit</button><button class="btn danger sm" data-delete-medicine="${m.id}">Delete</button></div></td></tr>`).join('') : `<tr><td colspan="9">${emptyState('No medicines found.', '<button class="btn" id="empty-add-medicine">Add your first medicine</button>')}</td></tr>`}</tbody></table></div><div class="pagination"><span class="small muted">Showing ${rows.length} of ${filtered.length}</span><button class="btn secondary sm" id="med-prev">Previous</button><span class="pill muted">Page ${state.page} / ${pages}</span><button class="btn secondary sm" id="med-next">Next</button></div></div>`); document.getElementById('add-medicine-btn').onclick = () => openMedicineModal(null, { categories, manufacturers, suppliers }); const emptyBtn = document.getElementById('empty-add-medicine'); if (emptyBtn) emptyBtn.onclick = () => openMedicineModal(null, { categories, manufacturers, suppliers }); document.getElementById('medicine-search').oninput = (e) => { state.search = e.target.value; state.page = 1; renderCurrentRoute(); }; document.getElementById('clear-med-search').onclick = () => { state.search = ''; state.page = 1; renderCurrentRoute(); }; document.getElementById('medicine-category-filter').onchange = (e) => { state.category = e.target.value; state.page = 1; renderCurrentRoute(); }; document.getElementById('med-prev').onclick = () => { state.page = Math.max(1, state.page - 1); renderCurrentRoute(); }; document.getElementById('med-next').onclick = () => { state.page = Math.min(pages, state.page + 1); renderCurrentRoute(); }; document.querySelectorAll('[data-edit-medicine]').forEach((el) => el.onclick = () => openMedicineModal(medicines.find((m) => Number(m.id) === Number(el.dataset.editMedicine)), { categories, manufacturers, suppliers })); document.querySelectorAll('[data-delete-medicine]').forEach((el) => el.onclick = async () => { const id = Number(el.dataset.deleteMedicine); const med = medicines.find((m) => m.id === id); if (await Utils.confirm('Delete medicine', `Delete ${med.name}? This does not remove historical transactions.`, true)) { await DB.delete('medicines', id); await addAudit('Medicine Delete', 'Medicines', `${med.name} removed`); Utils.toast('Medicine deleted.', 'success'); renderCurrentRoute(); } }); }
    function openMedicineModal(medicine, refs) { const m = medicine || { status:'Active', prescriptionRequired:false, tax:APP.settings.defaultTax, reorderLevel:APP.settings.lowStockThreshold }; Utils.openModal({ title:medicine ? 'Edit Medicine' : 'Add Medicine', size:'md', content:`<div class="form-grid cols-3"><div class="field"><label>Name</label><input name="name" value="${Utils.escapeHtml(m.name || '')}" required /></div><div class="field"><label>Generic Name</label><input name="genericName" value="${Utils.escapeHtml(m.genericName || '')}" required /></div><div class="field"><label>Brand</label><input name="brand" value="${Utils.escapeHtml(m.brand || '')}" required /></div><div class="field"><label>Code</label><input name="code" value="${Utils.escapeHtml(m.code || '')}" required /></div><div class="field"><label>Category</label><select name="categoryId" required>${refs.categories.map((c) => `<option value="${c.id}" ${Number(m.categoryId)===Number(c.id)?'selected':''}>${Utils.escapeHtml(c.name)}</option>`).join('')}</select></div><div class="field"><label>Manufacturer</label><select name="manufacturerId"><option value="">Select manufacturer</option>${refs.manufacturers.map((r) => `<option value="${r.id}" ${Number(m.manufacturerId)===Number(r.id)?'selected':''}>${Utils.escapeHtml(r.name)}</option>`).join('')}</select></div><div class="field"><label>Supplier</label><select name="supplierId"><option value="">Select supplier</option>${refs.suppliers.map((r) => `<option value="${r.id}" ${Number(m.supplierId)===Number(r.id)?'selected':''}>${Utils.escapeHtml(r.company)}</option>`).join('')}</select></div><div class="field"><label>Strength</label><input name="strength" value="${Utils.escapeHtml(m.strength || '')}" /></div><div class="field"><label>Dosage Form</label><select name="dosageForm">${DOSAGE_FORMS.map((f) => `<option value="${f}" ${m.dosageForm===f?'selected':''}>${f}</option>`).join('')}</select></div><div class="field"><label>Pack Size</label><input name="packSize" value="${Utils.escapeHtml(m.packSize || '')}" /></div><div class="field"><label>Unit</label><input name="unit" value="${Utils.escapeHtml(m.unit || '')}" /></div><div class="field"><label>Purchase Price</label><input name="purchasePrice" type="number" step="0.01" value="${m.purchasePrice || 0}" /></div><div class="field"><label>Retail Price</label><input name="retailPrice" type="number" step="0.01" value="${m.retailPrice || 0}" /></div><div class="field"><label>Wholesale Price</label><input name="wholesalePrice" type="number" step="0.01" value="${m.wholesalePrice || 0}" /></div><div class="field"><label>Min Selling Price</label><input name="minSellingPrice" type="number" step="0.01" value="${m.minSellingPrice || 0}" /></div><div class="field"><label>Tax %</label><input name="tax" type="number" step="0.01" value="${m.tax || 0}" /></div><div class="field"><label>Reorder Level</label><input name="reorderLevel" type="number" value="${m.reorderLevel || 0}" /></div><div class="field"><label>Max Stock</label><input name="maxStock" type="number" value="${m.maxStock || 0}" /></div><div class="field"><label>Status</label><select name="status"><option ${m.status==='Active'?'selected':''}>Active</option><option ${m.status==='Inactive'?'selected':''}>Inactive</option></select></div><div class="field"><label><input type="checkbox" name="prescriptionRequired" ${m.prescriptionRequired ? 'checked' : ''} style="width:auto; margin-right:8px;" />Prescription Required</label></div><div class="field span-3"><label>Description</label><textarea name="description">${Utils.escapeHtml(m.description || '')}</textarea></div><div class="field span-3"><label>Storage Instructions</label><textarea name="storageInstructions">${Utils.escapeHtml(m.storageInstructions || '')}</textarea></div></div>`, onSubmit:async (formData, form, close) => { const obj = Object.fromEntries(formData.entries()); obj.categoryId = Number(obj.categoryId); obj.manufacturerId = obj.manufacturerId ? Number(obj.manufacturerId) : null; obj.supplierId = obj.supplierId ? Number(obj.supplierId) : null; ['purchasePrice','retailPrice','wholesalePrice','minSellingPrice','tax','reorderLevel','maxStock'].forEach((k) => obj[k] = Utils.parseNumber(obj[k])); obj.prescriptionRequired = form.querySelector('[name="prescriptionRequired"]').checked; obj.category = refs.categories.find((c) => Number(c.id) === obj.categoryId)?.name || ''; obj.manufacturer = refs.manufacturers.find((x) => Number(x.id) === obj.manufacturerId)?.name || ''; obj.supplier = refs.suppliers.find((x) => Number(x.id) === obj.supplierId)?.company || ''; if (medicine) { const priceChanged = Number(medicine.retailPrice) !== Number(obj.retailPrice) || Number(medicine.purchasePrice) !== Number(obj.purchasePrice); await DB.put('medicines', { ...medicine, ...obj }); await addAudit(priceChanged ? 'Price Change' : 'Medicine Edit', 'Medicines', `${obj.name} updated`); } else { await DB.add('medicines', obj); await addAudit('Medicine Create', 'Medicines', `${obj.name} added`); } close(); Utils.toast(`Medicine ${medicine ? 'updated' : 'added'} successfully.`, 'success'); renderCurrentRoute(); } }); }
    async function renderBatches() { const { medicines, batches, suppliers } = await getMasterData(); const state = APP.state.batches; const rows = batches.filter((b) => { const med = medicines.find((m) => Number(m.id) === Number(b.medicineId)); const searchText = `${med?.name || ''} ${b.batchNumber}`.toLowerCase(); const matchSearch = !state.search || searchText.includes(state.search.toLowerCase()); const matchMedicine = state.medicineId === 'all' || Number(b.medicineId) === Number(state.medicineId); return matchSearch && matchMedicine; }).sort((a,b) => new Date(a.expiryDate) - new Date(b.expiryDate)); setContent(`${pageHeader('Batch Management', 'Monitor batch-wise stock, expiry dates, and supplier source.')}<div class="card"><div class="toolbar"><div class="search-wrap"><span>🔎</span><input id="batch-search" placeholder="Search by batch or medicine" value="${Utils.escapeHtml(state.search)}" /><button class="icon-btn sm" id="clear-batch-search">✕</button></div><select id="batch-medicine-filter"><option value="all">All medicines</option>${medicines.map((m) => `<option value="${m.id}" ${String(state.medicineId)===String(m.id)?'selected':''}>${Utils.escapeHtml(m.name)}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Batch No</th><th>Medicine</th><th>Mfg / Expiry</th><th>Purchase / Sell</th><th>Purchased</th><th>Current Qty</th><th>Supplier</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.length ? rows.map((b) => { const med = medicines.find((m) => Number(m.id) === Number(b.medicineId)); const status = batchStatusFor(b); return `<tr><td class="mono">${Utils.escapeHtml(b.batchNumber)}</td><td><strong>${Utils.escapeHtml(med?.name || '')}</strong><div class="small muted">${Utils.escapeHtml(med?.code || '')}</div></td><td>${Utils.date(b.mfgDate)}<div class="small muted">Exp: ${Utils.date(b.expiryDate)} (${Utils.daysUntil(b.expiryDate)} days)</div></td><td>${Utils.currency(b.purchasePrice)} / <strong>${Utils.currency(b.sellingP     function openBatchModal(batch, medicines, suppliers) { Utils.openModal({ title:`Edit Batch ${batch.batchNumber}`, content:`<div class="form-grid cols-2"><div class="field"><label>Medicine</label><select name="medicineId">${medicines.map((m) => `<option value="${m.id}" ${Number(batch.medicineId)===Number(m.id)?'selected':''}>${Utils.escapeHtml(m.name)}</option>`).join('')}</select></div><div class="field"><label>Supplier</label><select name="supplierId">${suppliers.map((s) => `<option value="${s.id}" ${Number(batch.supplierId)===Number(s.id)?'selected':''}>${Utils.escapeHtml(s.company)}</option>`).join('')}</select></div><div class="field"><label>Batch Number</label><input name="batchNumber" value="${Utils.escapeHtml(batch.batchNumber)}" required /></div><div class="field"><label>Mfg Date</label><input type="date" name="mfgDate" value="${batch.mfgDate || ''}" /></div><div class="field"><label>Expiry Date</label><input type="date" name="expiryDate" value="${batch.expiryDate || ''}" required /></div><div class="field"><label>Qty Purchased</label><input type="number" name="qtyPurchased" value="${batch.qtyPurchased || 0}" /></div><div class="field"><label>Current Qty</label><input type="number" name="currentQty" value="${batch.currentQty || 0}" /></div><div class="field"><label>Purchase Price</label><input type="number" step="0.01" name="purchasePrice" value="${batch.purchasePrice || 0}" /></div><div class="field"><label>Selling Price</label><input type="number" step="0.01" name="sellingPrice" value="${batch.sellingPrice || 0}" /></div></div>`, onSubmit:async (formData, _, close) => { const originalQty = Number(batch.currentQty || 0); const obj = Object.fromEntries(formData.entries()); ['medicineId','supplierId','qtyPurchased','currentQty','purchasePrice','sellingPrice'].forEach((k) => obj[k] = Utils.parseNumber(obj[k])); const updated = { ...batch, ...obj, status:batchStatusFor({ ...batch, ...obj }) }; await DB.put('batches', updated); const diff = Number(updated.cu     async function renderInventory() { const { medicines, batches, categories } = await getMasterData(); const state = APP.state.inventory; const stockMap = getMedicineStockMap(medicines, batches); const rows = medicines.filter((m) => { const stock = stockMap[m.id]?.qty || 0; const activeDays = batches.filter((b) => Number(b.medicineId) === Number(m.id) && Number(b.currentQty) > 0).map((b) => Utils.daysUntil(b.expiryDate)); const days = activeDays.length ? Math.min(...activeDays) : 999999; const matchCategory = state.category === 'all' || Number(m.categoryId) === Number(state.category); const matchStock = state.stockStatus === 'all' || (state.stockStatus === 'low' && stock > 0 && stock <= Number(m.reorderLevel || APP.settings.lowStockThreshold)) || (state.stockStatus === 'out' && stock === 0) || (state.stockStatus === 'ok' && stock > Number(m.reorderLevel || APP.settings.lowStockThreshold)); const matchExpiry = state.expiryStatus === 'all' || (state.expiryStatus === 'expired' && batches.some((b) => Number(b.medicineId) === Number(m.id) && batchStatusFor(b) === 'Expired')) || (state.expiryStatus === 'near' && days >= 0 && days <= APP.settings.expiryAlertDays) || (state.expiryStatus === 'fresh' && days > APP.settings.expiryAlertDays); return matchCategory && matchStock && matchExpiry; }); const movements = (await DB.getAll('stockMovements')).sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 20); setContent(`${pageHeader('Inventory Management', 'Stock aggregation, movements, and quantity adjustments.')}<div class="card" style="margin-bottom:16px;"><div class="toolbar"><select id="inv-category"><option value="all">All categories</option>${categories.map((c) => `<option value="${c.id}" ${String(state.category)===String(c.id)?'selected':''}>${Utils.escapeHtml(c.name)}</option>`).join('')}</select><select id="inv-stock"><option value="all">All stock status</option><option value="low" ${state.stockStatus==='low'?'selected':''}>Low stock</option><option value="out" eader" style="margin-bottom:12px;"><div><div style="font-size:18px; font-weight:700;">Recent Stock Movements</div><div class="page-desc">Purchases, sales, returns and adjustments</div></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Medicine</th><th>Batch</th><th>Type</th><th>Qty</th><th>Reference</th><th>Reason</th></tr></thead><tbody>${movements.length ? movements.map((m) => `<tr><td>${Utils.date(m.date)}</td><td>${Utils.escapeHtml(medicines.find((x) => Number(x.id) === Number(m.medicineId))?.name || '')}</td><td>${Utils.escapeHtml(batches.find((b) => Number(b.id) === Number(m.batchId))?.batchNumber || '-')}</td><td><span class="pill ${m.type.includes('return') ? 'info' : m.type==='sale' ? 'warning' : m.type==='adjustment' ? 'danger' : 'success'}">${Utils.escapeHtml(m.type)}</span></td><td>${m.qty}</td><td>${Utils.escapeHtml(`${m.referenceType} #${m.referenceId}`)}</td><td>${Utils.escapeHtml(m.reason || '')}</td></tr>`).join('') : `<tr><td colspan="7">${emptyState('No stock movements yet.')}</td></tr>`}</tbody></table></div></div>`); document.getElementById('inv-category').onchange = (e) => { state.category = e.target.value; renderCurrentRoute(); }; document.getElementById('inv-stock').onchange = (e) => { state.stockStatus = e.target.value; renderCurrentRoute(); }; document.getElementById('inv-expiry').onchange = (e) => { state.expiryStatus = e.target.value; renderCurrentRoute(); }; document.querySelectorAll('[data-adjust-stock]').forEach((el) => el.onclick = () => openStockAdjustmentModal(rows.find((m) => Number(m.id) === Number(el.dataset.adjustStock)), batches)); }
    function openStockAdjustmentModal(medicine, batches) { const relevant = batches.filter((b) => Number(b.medicineId) === Number(medicine.id)); Utils.openModal({ title:`Stock Adjustment • ${medicine.name}`, content:`<div class="field"><label>Batch</label><select name="batchId">${relevant.map((b) => `<option value="${b.id}">${Utils.escapeHtml(b.batchNumber)} • ${b.currentQty} left • Exp ${b.expiryDate}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>Action</label><select name="mode"><option value="add">Add</option><option value="remove">Remove</option></select></div><div class="field"><label>Quantity</label><input type="number" min="1" name="qty" value="1" required /></div></div><div class="field"><label>Reason</label><textarea name="reason" required placeholder="Describe the adjustment reason"></textarea></div>`, onSubmit:async (fd, _, close) => { const batch = await DB.get('batches', Number(fd.get('batchId'))); const qty = Utils.parseNumber(fd.get('qty')); const mode = fd.get('mode'); const diff = mode === 'add' ? qty : -qty; if (mode === 'remove' && Number(batch.currentQty) < qty) throw new Error('Cannot remove more than current stock.'); batch.currentQty = Number(batch.currentQty) + diff; batch.status = batchStatusFor(batch); await DB.put('batches', batch); await DB.add('stockMovements', { medicineId:medicine.id, batchId:batch.id, type:'adjustment', qty:diff, date:Utils.today(), referenceType:'adjustment', referenceId:batch.id, reason:fd.get('reason'), userId:APP.user?.id || null }); await addAudit('Stock Adjustment', 'Inventory', `${medicine.name} adjusted by ${diff}`); close(); Utils.toast('Stock adjusted successfully.', 'success'); await ensureSystemNotifications(); renderCurrentRoute(); } }); }
    function newPurchaseItemRow(medicines) { return `<tr><td><select class="purchase-medicine">${medicines.map((m) => `<option value="${m.id}" data-buy="${m.purchasePrice || 0}" data-sell="${m.retailPrice || 0}">${Utils.escapeHtml(m.name)}</option>`).join('')}</select></td><td><input class="purchase-batch" placeholder="Batch no" /></td><td><input type="date" class="purchase-mfg" /></td><td><input type="date" class="purchase-expiry" /></td><td><input type="number" class="purchase-qty" min="1" value="1" /></td><td><input type="number" class="purchase-price" step="0.01" value="0" /></td><td><input type="number" class="purchase-sell" step="0.01" value="0" /></td><td><button class="btn danger sm" type="button" data-remove-purchase-row>Remove</button></td></tr>`; }
    async function renderPurchases() { const { medicines, suppliers, purchases, purchaseItems } = await getMasterData(); const state = APP.state.purchases; const invoicePreview = formatDocNumber(APP.settings.purchasePrefix, APP.settings.nextPurchaseNumber || 1); const rows = purchases.filter((p) => { const supplier = suppliers.find((s) => Number(s.id) === Number(p.supplierId)); const text = `${p.invoiceNumber} ${supplier?.company || ''}`.toLowerCase(); const matchSearch = !state.search || text.includes(state.search.toLowerCase()); const matchSupplier = state.supplierId === 'all' || Number(p.supplierId) === Number(state.supplierId); return matchSearch && matchSupplier; }).sort((a,b) => new Date(b.date) - new Date(a.date)); setContent(`${pageHeader('Purchase Module', 'Create purchase invoices and receive batch-wise inventory.')}<div class="grid"><div class="card"><div class="page-header" style="margin-bottom:12px;"><div><div style="font-size:18px; font-weight:700;">New Purchase</div><div class="page-desc">Invoice preview: <span class="mono">${invoicePreview}</span></div></div></div><form id="purchase-form" class="grid" style="gap:16px;"><div class="form-grid cols-4"><div class="field"><label>Supplier</label><select name="supplierId" required>${suppliers.map((s) => `<option value="${s.id}">${Utils.escapeHtml(s.company)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" name="date" value="${Utils.today()}" required /></div><div class="field"><label>Invoice Number</label><input name="invoiceNumber" value="${invoicePreview}" /></div><div class="field"><label>Payment Method</label><select name="paymentMethod">${PAYMENT_METHODS.map((m) => `<option>${m}</option>`).join('')}</select></div></div><div class="table-wrap"><table id="purchase-items-table"><thead><tr><th>Medicine</th><th>Batch No</th><th>Mfg Date</th><th>Expiry Date</th><th>Qty</th><th>Purchase Price</th><th>Selling Price</th><th></th></tr></thead><tbody>${newPurchaseItemRo     function bindPurchaseForm(medicines) { const tbody = document.querySelector('#purchase-items-table tbody'); const hydrateRow = (tr) => { const medSelect = tr.querySelector('.purchase-medicine'); const buy = tr.querySelector('.purchase-price'); const sell = tr.querySelector('.purchase-sell'); const setFrom = () => { const opt = medSelect.selectedOptions[0]; if (!buy.value || Number(buy.value) === 0) buy.value = opt.dataset.buy || 0; if (!sell.value || Number(sell.value) === 0) sell.value = opt.dataset.sell || 0; }; medSelect.onchange = setFrom; setFrom(); tr.querySelector('[data-remove-purchase-row]').onclick = () => { if (tbody.children.length > 1) tr.remove(); }; }; tbody.querySelectorAll('tr').forEach(hydrateRow); document.getElementById('add-purchase-row').onclick = () => { tbody.insertAdjacentHTML('beforeend', newPurchaseItemRow(medicines)); hydrateRow(tbody.lastElementChild); }; document.getElementById('purchase-form').onsubmit = async (e) => { e.preventDefault(); try { const fd = new FormData(e.currentTarget); const items = Array.from(tbody.querySelectorAll('tr')).map((tr) => ({ medicineId:Number(tr.querySelector('.purchase-medicine').value), batchNumber:tr.querySelector('.purchase-batch').value.trim(), mfgDate:tr.querySelector('.purchase-mfg').value, expiryDate:tr.querySelector('.purchase-expiry').value, qty:Number(tr.querySelector('.purchase-qty').value), purchasePrice:Number(tr.querySelector('.purchase-price').value), sellingPrice:Number(tr.querySelector('.purchase-sell').value) })).filter((x) => x.batchNumber && x.expiryDate && x.qty > 0); await createPurchase({ supplierId:fd.get('supplierId'), date:fd.get('date'), invoiceNumber:fd.get('invoiceNumber'), paymentMethod:fd.get('paymentMethod'), discount:fd.get('discount'), tax:fd.get('tax'), paidAmount:fd.get('paidAmount'), notes:fd.get('notes'), items }); Utils.toast('Purchase saved successfully.', 'success'); renderCurrentRoute(); } catch (error) { Utils.toast(error.message, 'danger'); } }; }
